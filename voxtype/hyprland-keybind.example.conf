# voxbridge secondary dictation keybind for Hyprland.
#
# Add to ~/.config/hypr/bindings.conf (next to your existing Voxtype binds).
# Your normal dictation (SUPER CTRL, X) is unchanged and still types locally.
# This variant routes the transcription to the Windows VM instead, by writing it
# to the voxbridge FIFO (overrides Voxtype's output to file-only).
#
# Adjust the FIFO path if your $XDG_RUNTIME_DIR differs from /run/user/1000.

bindd  = SUPER CTRL SHIFT, X, Dictation -> VM (start), exec, voxtype record start --file=/run/user/1000/voxbridge.fifo
bindrd = SUPER CTRL SHIFT, X, Dictation -> VM (stop),  exec, voxtype record stop
