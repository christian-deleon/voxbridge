# voxbridge dictation keybind for Hyprland.
#
# Replace the start command of your existing Voxtype push-to-talk bind with
# voxbridge-dictate (installed into ~/.local/bin by install.sh). It routes by
# focus: VMware window -> the VM via voxbridge, anything else -> Voxtype's
# normal output. The release bind stays `voxtype record stop`.

bindd  = SUPER CTRL, X, Dictation (start), exec, voxbridge-dictate
bindrd = SUPER CTRL, X, Dictation (stop),  exec, voxtype record stop
